name: Verify transformer workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Full CPU story sweeps run in both Chromium and Firefox after numerical checks.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Dataset and tokenizer invariants (standard library)
        run: |
          python3 -m unittest discover -s scripts -p 'test_retrieval_data.py'
          python3 -m unittest discover -s scripts -p 'test_artifacts.py'
          python3 -m unittest discover -s scripts -p 'test_text_pipeline.py'
      # Reference sweeps are CPU-bound; keep files from competing for the same runner CPU.
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run check:artifacts
      - name: Prefer the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- --project=chromium --project=firefox
      - name: Package verified Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/
      - name: Preserve production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transformer-scope-static-build
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  hosted-check:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Prefer the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
      - name: Check the deployed release
        run: npm run test:hosted
        env:
          HOSTED_BASE_URL: ${{ needs.deploy.outputs.url }}
          EXPECTED_COMMIT: ${{ github.sha }}
      - name: Preserve hosted diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
