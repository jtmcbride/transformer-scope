name: Verify transformer workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Dataset invariants (standard library)
        run: |
          python3 -m unittest discover -s scripts -p 'test_retrieval_data.py'
          python3 -m unittest discover -s scripts -p 'test_artifacts.py'
      - run: npm test
      - run: npm run build
      - run: npm run check:artifacts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- --project=chromium --project=firefox
      - name: Preserve production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transformer-scope-static-build
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
